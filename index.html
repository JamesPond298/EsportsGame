  <style>
    :root{--bg:#08101e;--panel:#111c2f;--panel2:#16243a;--line:#263a57;--text:#eef4ff;--muted:#9cb0cb;--accent:#5ee6c4;--accent2:#22b99b;--danger:#ff6b7a;--warn:#ffc857;--good:#65e572;--shadow:0 14px 40px #0007}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#17335b 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{max-width:1200px;margin:auto;padding:22px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#6c8cff);color:#07111f;display:grid;place-items:center;font-weight:900}.brand h1{font-size:20px;margin:0}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.top-stats{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#0b1628;border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--muted)}.pill strong{color:var(--text)}nav{display:flex;gap:8px;padding:6px;background:#0b1628;border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow-x:auto}nav button{border:0;background:transparent;color:var(--muted);padding:10px 14px;border-radius:9px;white-space:nowrap;font-weight:700}nav button.active{background:var(--panel2);color:var(--text)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:linear-gradient(180deg,#142137,#101a2b);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px #0002}.card h2,.card h3{margin:0 0 6px}.card p{margin:6px 0}.hero{grid-column:span 8;min-height:245px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:230px;height:230px;border:45px solid var(--accent);opacity:.07;border-radius:50%;right:-75px;top:-70px}.finance{grid-column:span 4}.span7{grid-column:span 7}.span5{grid-column:span 5}.span12{grid-column:span 12}.muted{color:var(--muted)}.big{font-size:42px;font-weight:850;letter-spacing:-.04em;margin:8px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#0b1628;border:1px solid var(--line);border-radius:12px;padding:12px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:19px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;background:var(--accent);color:#061711}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:#22334e;color:var(--text)}.btn.danger{background:#5a2732;color:#ffdce1}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{border-left:3px solid var(--accent);background:#0b1628;padding:10px 12px;border-radius:8px;color:var(--muted)}.notice.warn{border-color:var(--warn)}.notice.bad{border-color:var(--danger)}.money.good{color:var(--good)}.money.bad{color:var(--danger)}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}th,td{padding:10px 8px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}.table-wrap{overflow-x:auto}.role{display:inline-block;background:#243751;color:#c9ddf6;border-radius:6px;padding:2px 7px;font-size:12px}.rating{font-weight:800}.bar{height:6px;background:#263650;border-radius:10px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--accent)}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.choice{position:relative;border:1px solid var(--line);background:#0b1628;padding:14px;border-radius:12px;cursor:pointer}.choice:hover{border-color:#4a6489}.choice.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.choice input{position:absolute;opacity:0}.choice strong{display:block}.choice small{color:var(--muted)}.strategy-grid{grid-template-columns:repeat(3,1fr)}.player-cards,.market{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.player{background:#0b1628;border:1px solid var(--line);border-radius:13px;padding:14px}.player-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.player h3{margin:0;font-size:16px}.player .realname{font-weight:400;color:var(--muted);font-size:12px}.ratings{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.ratings div{font-size:12px;color:var(--muted)}.ratings strong{float:right;color:var(--text)}.tag{font-size:11px;padding:3px 7px;border-radius:99px;background:#243651;color:#c5d7ef}.report{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0b1628;margin-top:10px}.score{font-size:28px;font-weight:900}.win{color:var(--good)}.loss{color:var(--danger)}.standings .you{background:#183044}.modal{position:fixed;inset:0;background:#030711dd;display:grid;place-items:center;padding:18px;z-index:20}.modal-box{width:min(570px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid #385272;border-radius:20px;padding:24px;box-shadow:var(--shadow)}.modal h2{font-size:28px}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input[type=text]{width:100%;background:#091426;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px}.colors{display:flex;gap:12px}.color-choice{width:45px;height:45px;border-radius:50%;border:3px solid transparent}.color-choice.selected{outline:3px solid white;outline-offset:2px}.help details{background:#0b1628;border:1px solid var(--line);padding:12px;border-radius:10px;margin:8px 0}.help summary{font-weight:800;cursor:pointer}.toast{position:fixed;right:20px;bottom:20px;background:#eafdf7;color:#092018;padding:12px 16px;border-radius:10px;font-weight:800;box-shadow:var(--shadow);z-index:40}.footer{color:var(--muted);font-size:12px;text-align:center;margin:26px 0 8px}.file-label{display:inline-block}.kicker{color:var(--accent);font-weight:800}.split{display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{text-align:center;color:var(--muted);padding:25px}
    @media(max-width:800px){.app{padding:12px}.topbar{align-items:flex-start;flex-direction:column}.hero,.finance,.span7,.span5,.span12{grid-column:span 12}.metrics{grid-template-columns:repeat(2,1fr)}.player-cards,.market{grid-template-columns:1fr}.choice-grid,.strategy-grid{grid-template-columns:1fr}.big{font-size:34px}.card{padding:14px}th,td{padding:9px 6px}}

<body>
  <div class="app" id="app"></div>
  <div id="modal"></div><div id="toast"></div>
  <script>
  'use strict';
  const SAVE_KEY='esports-org-sim-v1',SAVE_BACKUP_KEY='esports-org-sim-v1-pre-expansion-backup',SAVE_VERSION=3;
  const TUNING={startingCash:55000,sponsor:7200,bankruptcy:-15000,winRep:4,lossRep:1,training:{skill:{name:'Individual skills',cost:1800,fatigue:10,skill:.55,teamwork:0,prep:1,desc:'Improves aim and decision-making. High fatigue.'},team:{name:'Team coordination',cost:1400,fatigue:7,skill:0,teamwork:.7,prep:2,desc:'Builds teamwork and role timing. Moderate fatigue.'},prep:{name:'Match preparation',cost:1000,fatigue:4,skill:0,teamwork:.15,prep:6,desc:'A short-term edge against the next opponent.'},rest:{name:'Rest and recovery',cost:0,fatigue:-18,skill:0,teamwork:0,prep:0,desc:'Reduces fatigue and lifts morale, but adds no ratings.'}}};
  const roles=['Leader','Entry','Flex','Support','Sniper'];
  const basePlayers=[
    ['Maya Chen','Kestrel','Leader',61,68,67,79,72,12,1200],['Jon Bell','Rift','Entry',65,57,60,75,70,16,1100],['Elena Ortiz','Luma','Flex',62,64,66,82,74,10,1050],['Darius King','Anchor','Support',58,71,72,73,76,8,950],['Noah Kim','Frost','Sniper',67,59,58,80,69,14,1250]
  ];
  const marketBase=[
    ['Priya Shah','Tempo','Leader',58,70,65,86,72,8,900,3000],['Luis Mora','Spark','Entry',68,54,56,84,67,14,1350,6500],['Tessa Ward','Mosaic','Flex',63,66,69,78,75,9,1200,4800],['Omar Reed','Harbor','Support',69,76,73,75,78,7,1900,10500],['Sora Park','Halo','Sniper',75,72,64,88,71,12,2600,17500],['Ben Ito','Quill','Flex',54,60,62,92,79,5,750,1800]
  ];
  const rivals=[
    {id:'aurora',name:'Aurora Circuit',power:65,teamwork:66,color:'#8b7cff'}, {id:'forge',name:'Iron Forge',power:70,teamwork:61,color:'#ff805c'},
    {id:'zenith',name:'Zenith Union',power:73,teamwork:72,color:'#ffd15c'}, {id:'tidal',name:'Tidal Core',power:62,teamwork:75,color:'#50b7ff'},
    {id:'ember',name:'Ember Five',power:68,teamwork:64,color:'#ff5d78'}, {id:'north',name:'Northstar',power:76,teamwork:70,color:'#d2efff'},
    {id:'vertex',name:'Vertex Labs',power:60,teamwork:59,color:'#86e66c'}
  ];
  let state=null,activeTab='dashboard',selectedColor='#5ee6c4',advancing=false,loadError='';
  function clone(x){return JSON.parse(JSON.stringify(x))}
  function makePlayer(a,i){return{id:'p'+Date.now()+i+Math.floor(Math.random()*9999),name:a[0],nick:a[1],role:a[2],skill:a[3],consistency:a[4],teamwork:a[5],potential:a[6],morale:a[7],fatigue:a[8],salary:a[9]}}
  function makeSchedule(){let ids=['player',...rivals.map(x=>x.id)], rounds=[];for(let r=0;r<7;r++){let games=[];for(let i=0;i<4;i++)games.push([ids[i],ids[7-i]]);rounds.push(games);ids.splice(1,0,ids.pop())}return rounds}
  function expansionDefaults(data){return{totalWeeks:0,activeDivisionId:'tactical',divisions:{tactical:{id:'tactical',kind:'tactical_shooter',name:'Tactical Shooter',active:true,openedWeek:0,fans:1200,legacyRoster:true,competitiveHistory:[]}},archivedDivisions:[],calendar:[],organizationHistory:[],creators:[],creatorMarket:[],sponsorships:{slots:2,active:[{id:'starter-sponsor',name:'Pulse Hydration',kind:'organization',weeklyPayment:TUNING.sponsor,remainingWeeks:null}],offers:[]},storyEvents:{pending:null,lastTriggeredWeek:-3,seen:[]},expansionTutorialSeen:false}}
  function newState(name,color){const teams={player:{id:'player',name,color,w:0,l:0,pointsFor:0,pointsAgainst:0}};rivals.forEach(t=>teams[t.id]={...clone(t),w:0,l:0,pointsFor:0,pointsAgainst:0});return{version:SAVE_VERSION,saveVersion:SAVE_VERSION,orgName:name,color,week:1,season:1,cash:TUNING.startingCash,reputation:20,players:basePlayers.map(makePlayer),market:marketBase.map(makePlayer).map((p,i)=>({...p,fee:marketBase[i][10]})),teams,schedule:makeSchedule(),training:'team',strategy:'balanced',reports:[],ledger:[],randomSeed:Math.floor(Math.random()*2147483646)+1,phase:'regular',playoffs:null,bankrupt:false,tutorial:true,...expansionDefaults()}}
  function validateSave(data){if(!data||typeof data!=='object')throw Error('The file does not contain a game save.');if(typeof data.orgName!=='string'||!data.orgName.trim())throw Error('The organization name is missing.');if(!Number.isFinite(data.cash)||!Number.isFinite(data.season)||!Number.isFinite(data.week))throw Error('The money or season information is damaged.');if(!Array.isArray(data.players)||data.players.length<1)throw Error('The player roster is missing.');if(!data.teams||!data.teams.player||!Array.isArray(data.schedule))throw Error('The league information is incomplete.');return true}
  function estimatedTotalWeeks(data){const seasonBase=(Math.max(1,data.season||1)-1)*9;if(data.phase==='semis')return seasonBase+7;if(data.phase==='final')return seasonBase+8;if(data.phase==='complete')return seasonBase+9;return seasonBase+Math.max(0,Math.min(6,(data.week||1)-1))}
  function migrateSave(input,keepBackup=false){validateSave(input);const oldVersion=Number(input.saveVersion||input.version||1);if(oldVersion>SAVE_VERSION)throw Error('This save was made by a newer version of the game.');if(keepBackup&&oldVersion<SAVE_VERSION)localStorage.setItem(SAVE_BACKUP_KEY,JSON.stringify(input));const data=clone(input),hadTotalWeeks=Number.isFinite(input.totalWeeks),defaults=expansionDefaults(data);for(const [key,value] of Object.entries(defaults))if(data[key]===undefined)data[key]=value;if(!data.divisions.tactical)data.divisions.tactical=defaults.divisions.tactical;if(!hadTotalWeeks)data.totalWeeks=estimatedTotalWeeks(input);data.version=SAVE_VERSION;data.saveVersion=SAVE_VERSION;return data}
  function rng(){state.randomSeed=(state.randomSeed*48271)%2147483647;return state.randomSeed/2147483647}
  function money(n){return (n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString()}
  function clamp(v,a=0,b=100){return Math.max(a,Math.min(b,v))}
  function teamName(id){return state.teams[id]?.name||id}
  function standings(){return Object.values(state.teams).sort((a,b)=>b.w-a.w||(b.pointsFor-b.pointsAgainst)-(a.pointsFor-a.pointsAgainst)||b.pointsFor-a.pointsFor)}
  function playerTeamPower(){const ps=state.players.slice().sort((a,b)=>b.skill-a.skill).slice(0,5);const skill=avg(ps.map(p=>p.skill)), consistency=avg(ps.map(p=>p.consistency)), teamwork=avg(ps.map(p=>p.teamwork)), morale=avg(ps.map(p=>p.morale)), fatigue=avg(ps.map(p=>p.fatigue));const missing=roles.filter(r=>!ps.some(p=>p.role===r)).length;return{total:skill*.54+consistency*.12+teamwork*.20+morale*.10-fatigue*.18-missing*4,skill,consistency,teamwork,morale,fatigue,missing}}
  function avg(a){return a.reduce((x,y)=>x+y,0)/Math.max(1,a.length)}
  function nextOpponent(){if(state.phase==='regular'){const game=state.schedule[state.week-1]?.find(g=>g.includes('player'));return game?teamName(game[0]==='player'?game[1]:game[0]):'—'}if(state.phase==='semis'&&state.playoffs){const g=state.playoffs.semis.find(g=>g.includes('player'));return g?teamName(g[0]==='player'?g[1]:g[0]):'No match'}if(state.phase==='final'&&state.playoffs?.final){const g=state.playoffs.final;return g.includes('player')?teamName(g[0]==='player'?g[1]:g[0]):'No match'}return'—'}
  function weeklySalary(){return state.players.reduce((s,p)=>s+p.salary,0)}
  function save(){state.version=SAVE_VERSION;state.saveVersion=SAVE_VERSION;localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
  function toast(msg){const el=document.getElementById('toast');el.innerHTML='<div class="toast">'+msg+'</div>';setTimeout(()=>el.innerHTML='',2200)}
  function setup(){document.getElementById('app').innerHTML='<div class="topbar"><div class="brand"><div class="mark">EOS</div><div><div class="eyebrow">Front office simulator</div><h1>Esports Org Simulator</h1></div></div></div><div class="card" style="max-width:700px;margin:10vh auto"><div class="eyebrow">New organization</div><h2>Build a team worth cheering for.</h2><p class="muted">Name your organization and choose its accent color. Your first roster and sponsor are already waiting.</p><div class="field"><label for="org">Organization name</label><input id="org" type="text" maxlength="28" value="Neon Harbor"></div><div class="field"><label>Team color</label><div class="colors">'+['#5ee6c4','#6c8cff','#ff6b7a','#ffc857'].map((c,i)=>`<button class="color-choice ${i===0?'selected':''}" style="background:${c}" data-color="${c}" aria-label="Choose color ${c}"></button>`).join('')+'</div></div><button class="btn" id="start">Start your organization</button></div>';document.querySelectorAll('.color-choice').forEach(b=>b.onclick=()=>{selectedColor=b.dataset.color;document.querySelectorAll('.color-choice').forEach(x=>x.classList.toggle('selected',x===b))});document.getElementById('start').onclick=()=>{let n=document.getElementById('org').value.trim();if(!n)return toast('Please enter a team name.');state=newState(n,selectedColor);save();render()}}
  function shell(content){let rank=state.phase==='regular'?standings().findIndex(t=>t.id==='player')+1:'Playoffs';document.documentElement.style.setProperty('--accent',state.color);document.getElementById('app').innerHTML=`<header class="topbar"><div class="brand"><div class="mark">${state.orgName.slice(0,2).toUpperCase()}</div><div><div class="eyebrow">Season ${state.season} · ${phaseLabel()}</div><h1>${state.orgName}</h1></div></div><div class="top-stats"><div class="pill">Cash <strong>${money(state.cash)}</strong></div><div class="pill">Reputation <strong>${state.reputation}</strong></div><div class="pill">Position <strong>${typeof rank==='number'?'#'+rank:rank}</strong></div></div></header><nav>${[['dashboard','Dashboard'],['team','Team & Training'],['recruit','Recruitment'],['league','League & Results'],['help','Help & Saves']].map(x=>`<button data-tab="${x[0]}" class="${activeTab===x[0]?'active':''}">${x[1]}</button>`).join('')}</nav><main>${content}</main><div class="footer">Esports Org Simulator · Your progress saves automatically on this device.</div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render()})}
  function phaseLabel(){return state.phase==='regular'?'Week '+state.week+' of 7':state.phase==='semis'?'Semifinals':state.phase==='final'?'Championship Final':'Season complete'}
  function render(){if(!state){setup();return}if(state.bankrupt){bankruptView();return}if(state.phase==='complete'){seasonView();return}({dashboard:renderDashboard,team:renderTeam,recruit:renderRecruit,league:renderLeague,help:renderHelp}[activeTab]||renderDashboard)();if(state.tutorial&&activeTab==='dashboard')tutorialModal()}
  function renderDashboard(){const p=playerTeamPower(), salary=weeklySalary(), training=TUNING.training[state.training], last=state.ledger[0];shell(`<div class="grid"><section class="card hero"><div><div class="eyebrow">Next match</div><div class="big">${nextOpponent()}</div><p class="muted">${state.phase==='regular'?'Regular season · Week '+state.week:phaseLabel()} · Strategy: <span class="kicker">${cap(state.strategy)}</span></p></div><div class="actions"><button class="btn" id="advance">Advance week</button><button class="btn secondary" data-go="team">Review training</button></div></section><section class="card finance"><div class="eyebrow">Weekly forecast</div><h2>${money(TUNING.sponsor-salary-training.cost)}</h2><p class="muted">Expected net change before prize money.</p><table><tr><td>Sponsor income</td><td class="money good">+${money(TUNING.sponsor)}</td></tr><tr><td>Player salaries</td><td class="money bad">-${money(salary)}</td></tr><tr><td>${training.name}</td><td class="money bad">-${money(training.cost)}</td></tr></table></section><section class="card span12"><div class="metrics"><div class="metric"><span>Team skill</span><strong>${p.skill.toFixed(0)}</strong></div><div class="metric"><span>Teamwork</span><strong>${p.teamwork.toFixed(0)}</strong></div><div class="metric"><span>Morale</span><strong>${p.morale.toFixed(0)}</strong></div><div class="metric"><span>Fatigue</span><strong>${p.fatigue.toFixed(0)}</strong></div></div>${state.players.length!==5?`<p class="notice bad">Your roster has ${state.players.length} players. You need exactly 5 before advancing. Release a player on Team & Training.</p>`:''}</section><section class="card span7"><div class="split"><div><div class="eyebrow">Latest result</div><h2>${state.reports[0]?.title||'Your debut awaits'}</h2></div>${state.reports[0]?`<div class="score ${state.reports[0].win?'win':'loss'}">${state.reports[0].score}</div>`:''}</div><p class="muted">${state.reports[0]?.summary||'Choose training and a strategy, then advance the week to play your first match.'}</p></section><section class="card span5"><div class="eyebrow">Last financial summary</div>${last?`<h2 class="${last.net>=0?'money good':'money bad'}">${last.net>=0?'+':''}${money(last.net)}</h2><p class="muted">Income ${money(last.income)} · Expenses ${money(last.expenses)}</p>`:'<p class="muted">Your first summary will appear after you advance a week.</p>'}</section></div>`);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.go;render()});document.getElementById('advance').onclick=advanceWeek}
  function renderTeam(){shell(`<div class="grid"><section class="car…4051 tokens truncated…t.getElementById('app').innerHTML=`<section class="card" style="max-width:650px;margin:12vh auto;text-align:center"><div class="eyebrow">Organization closed</div><h2>Bankruptcy</h2><div class="big money bad">${money(state.cash)}</div><p class="muted">Cash fell below ${money(TUNING.bankruptcy)}. High salaries and training costs can overwhelm sponsor income.</p><div class="actions" style="justify-content:center"><button class="btn secondary" id="exportDead">Export save</button><button class="btn danger" id="restart">Restart</button></div></section>`;document.getElementById('exportDead').onclick=exportSave;document.getElementById('restart').onclick=()=>{localStorage.removeItem(SAVE_KEY);state=null;setup()}}
  function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='esports-org-simulator-save.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported.')}
  const FIGHT_SETUP_COST=12000,FIGHT_CLOSE_COST=2500;
  const FIGHT_TRAINING={drills:{name:'Technical drills',cost:350,fatigue:9,skill:.65,prep:1,desc:'Builds execution, but adds the most fatigue.'},study:{name:'Matchup study',cost:250,fatigue:4,skill:.15,prep:7,desc:'Improves preparation for the next bracket.'},balanced:{name:'Balanced practice',cost:200,fatigue:6,skill:.3,prep:3,desc:'A steady mix of drills and preparation.'},rest:{name:'Rest',cost:0,fatigue:-17,skill:0,prep:0,desc:'Restores energy and morale without skill growth.'}};
  const FIGHT_STRATEGIES={adaptable:{name:'Adaptable',desc:'Steady and reliable against an unknown bracket.'},pressure:{name:'High pressure',desc:'Creates upset chances but increases inconsistency.'},defensive:{name:'Defensive',desc:'Rewards preparation and consistency over raw aggression.'}};
  const FIGHT_OPPONENTS=[['Ari “Nova” Vale',68,66],['Keon “Flux” Webb',63,72],['Mina “Parry” Cho',72,64],['Ezra “Bolt” Lane',59,70],['Gia “Tempo” Russo',66,75],['Theo “Brick” Ames',75,61],['Nia “Orbit” Banks',61,68]].map((x,i)=>({id:'fo'+i,name:x[0],skill:x[1],consistency:x[2]}));
  function divisionSelector(){const active=Object.values(state.divisions).filter(d=>d.active);return`<div class="card" style="margin-bottom:14px;padding:10px"><span class="muted" style="margin-right:8px">Viewing division:</span>${active.map(d=>`<button class="btn ${state.activeDivisionId===d.id?'':'secondary'}" data-division="${d.id}">${d.name}</button>`).join(' ')}</div>`}
  function attachDivisionSelector(){document.querySelectorAll('[data-division]').forEach(button=>button.onclick=()=>{state.activeDivisionId=button.dataset.division;save();render()})}
  function fightingDivision(){return state.divisions?.fighting}
  function nextFightEvent(d=fightingDivision()){if(!d)return'Not entered';const weeks=Math.max(0,d.nextTournamentWeek-state.totalWeeks);return weeks===0?'Circuit event this week':weeks===1?'Circuit event next week':`Circuit event in ${weeks} weeks`}
  function fightWeeklyForecast(d=fightingDivision()){if(!d)return 0;const training=FIGHT_TRAINING[d.training]||FIGHT_TRAINING.balanced;return-(d.competitor.salary+training.cost+(d.nextTournamentWeek===state.totalWeeks+1?200:0))}
  function divisionCards(){const tactical=state.divisions.tactical,fight=fightingDivision(),tacticalNet=(state.ledger[0]?.divisionBreakdown?.tactical??state.ledger[0]?.net??0);return`<div class="grid" style="margin-top:14px"><section class="card span${fight?'7':'12'}"><div class="split"><div><div class="eyebrow">Active division</div><h2>${tactical.name}</h2></div><span class="tag">${state.teams.player.w}–${state.teams.player.l}</span></div><p class="muted">${nextOpponent()} next · ${tactical.fans.toLocaleString()} fans</p><p>Latest: ${state.reports[0]?.title||'No result yet'}</p><p class="${tacticalNet>=0?'money good':'money bad'}">Last weekly contribution: ${signedMoney(tacticalNet)}</p><button class="btn secondary" data-open-division="tactical">Manage division</button></section>${fight?`<section class="card span5"><div class="split"><div><div class="eyebrow">Active division</div><h2>${fight.name}</h2></div><span class="tag">Solo circuit</span></div><p class="muted">${nextFightEvent(fight)} · ${fight.fans.toLocaleString()} fans</p><p>Latest: ${fight.history[0]?.summary||'Preparing for a first tournament'}</p><p class="${fight.lastWeeklyNet>=0?'money good':'money bad'}">Last weekly contribution: ${signedMoney(fight.lastWeeklyNet||0)}</p>${fight.competitor.fatigue>65?'<p class="notice warn">Action needed: your competitor is highly fatigued.</p>':''}<button class="btn secondary" data-open-division="fighting">Manage division</button></section>`:''}</div>`}
  function signedMoney(value){return(value>=0?'+':'')+money(value)}
  const coreShellForDivisions=shell;
  shell=function(content){coreShellForDivisions(content);const nav=document.querySelector('nav'),dashboardButton=nav?.querySelector('[data-tab="dashboard"]');if(dashboardButton)dashboardButton.textContent='Organization';if(nav&&!nav.querySelector('[data-tab="expansion"]')){nav.insertAdjacentHTML('beforeend',`<button data-tab="expansion" class="${activeTab==='expansion'?'active':''}">Enter a New Esport</button>`);nav.querySelector('[data-tab="expansion"]').onclick=()=>{activeTab='expansion';render()}}}
  const coreRenderForDivisions=render;
  render=function(){if(state&&activeTab==='expansion')return renderExpansion();return coreRenderForDivisions()}
  const coreDashboardForDivisions=renderDashboard;
  renderDashboard=function(){const p=playerTeamPower(),salary=weeklySalary(),training=TUNING.training[state.training],fightForecast=fightWeeklyForecast(),last=state.ledger[0];shell(`<div class="grid"><section class="card hero"><div><div class="eyebrow">Organization headquarters</div><div class="big">${phaseLabel()}</div><p class="muted">All active divisions advance together. Tactical opponent: <span class="kicker">${nextOpponent()}</span></p></div><div class="actions"><button class="btn" id="advance">Next Week</button><button class="btn secondary" data-go="team">Manage divisions</button></div></section><section class="card finance"><div class="eyebrow">Organization forecast</div><h2>${money(TUNING.sponsor-salary-training.cost+fightForecast)}</h2><p class="muted">Expected net change before prizes.</p><table><tr><td>Organization sponsor</td><td class="money good">+${money(TUNING.sponsor)}</td></tr><tr><td>Tactical division</td><td class="money bad">-${money(salary+training.cost)}</td></tr>${fightingDivision()?`<tr><td>Fighting division</td><td class="money bad">${money(fightForecast)}</td></tr>`:''}</table></section><section class="card span12"><div class="metrics"><div class="metric"><span>Divisions</span><strong>${Object.values(state.divisions).filter(d=>d.active).length}</strong></div><div class="metric"><span>Overall reputation</span><strong>${state.reputation}</strong></div><div class="metric"><span>Shared cash</span><strong>${money(state.cash)}</strong></div><div class="metric"><span>Organization week</span><strong>${state.totalWeeks+1}</strong></div></div>${state.players.length!==5?`<p class="notice bad">The tactical roster has ${state.players.length} players. It needs exactly 5 before Next Week.</p>`:''}</section></div>${divisionCards()}${last?`<section class="card" style="margin-top:14px"><div class="eyebrow">Latest organization finances</div><h2 class="${last.net>=0?'money good':'money bad'}">${signedMoney(last.net)}</h2><p class="muted">Income ${money(last.income)} · Expenses ${money(last.expenses)}</p></section>`:''}`);document.getElementById('advance').onclick=advanceWeek;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.go;render()});document.querySelectorAll('[data-open-division]').forEach(b=>b.onclick=()=>{state.activeDivisionId=b.dataset.openDivision;activeTab='team';save();render()})}
  const tacticalTeamScreen=renderTeam;
  renderTeam=function(){if(state.activeDivisionId==='fighting'&&fightingDivision())return renderFightTeam();tacticalTeamScreen();document.querySelector('main')?.insertAdjacentHTML('afterbegin',divisionSelector());attachDivisionSelector()}
  function renderFightTeam(){const d=fightingDivision(),p=d.competitor;shell(`${divisionSelector()}<div class="grid"><section class="card span7"><div class="eyebrow">Fighting division · One competitor</div><h2>${p.name}</h2><p class="muted">“${p.nick}” represents the organization alone. Individual skill, consistency, preparation, morale, and fatigue determine tournament performance.</p><div class="metrics"><div class="metric"><span>Skill</span><strong>${Math.round(p.skill)}</strong></div><div class="metric"><span>Consistency</span><strong>${Math.round(p.consistency)}</strong></div><div class="metric"><span>Preparation</span><strong>${Math.round(p.preparation)}</strong></div><div class="metric"><span>Morale</span><strong>${Math.round(p.morale)}</strong></div></div><p>Fatigue: <strong>${Math.round(p.fatigue)}</strong> · Salary: <strong>${money(p.salary)}/week</strong></p><p class="notice">${nextFightEvent(d)}. Tournament entry costs $200 when the event is played.</p></section><section class="card span5"><div class="eyebrow">Persistent weekly plan</div><h2>Training</h2><div class="choice-grid">${Object.entries(FIGHT_TRAINING).map(([key,t])=>`<label class="choice ${d.training===key?'selected':''}"><input type="radio" name="fight-training" value="${key}"><strong>${t.name}</strong><small>${t.desc}<br>${money(t.cost)} · Fatigue ${signed(t.fatigue)}</small></label>`).join('')}</div><h2>Competitive approach</h2><div class="choice-grid strategy-grid">${Object.entries(FIGHT_STRATEGIES).map(([key,s])=>`<label class="choice ${d.strategy===key?'selected':''}"><input type="radio" name="fight-strategy" value="${key}"><strong>${s.name}</strong><small>${s.desc}</small></label>`).join('')}</div><button class="btn danger" id="closeFight">Close division</button></section></div>`);attachDivisionSelector();document.querySelectorAll('input[name="fight-training"]').forEach(input=>input.onchange=()=>{d.training=input.value;save();render()});document.querySelectorAll('input[name="fight-strategy"]').forEach(input=>input.onchange=()=>{d.strategy=input.value;save();render()});document.getElementById('closeFight').onclick=closeFightDivision}
  const tacticalLeagueScreen=renderLeague;
  renderLeague=function(){if(state.activeDivisionId==='fighting'&&fightingDivision())return renderFightResults();tacticalLeagueScreen();document.querySelector('main')?.insertAdjacentHTML('afterbegin',divisionSelector());attachDivisionSelector()}
  function renderFightResults(){const d=fightingDivision(),latest=d.history[0];shell(`${divisionSelector()}<div class="grid"><section class="card span5"><div class="eyebrow">Fighting circuit</div><h2>${nextFightEvent(d)}</h2><p class="muted">Eight competitors play single-elimination best-of-five series. First to three games advances; one loss ends the run.</p><p>Champion $4,500 · Runner-up $1,800 · Semifinal $600 · Top 8 $200</p></section><section class="card span7"><div class="eyebrow">Competitive history</div><h2>${latest?.name||'First bracket pending'}</h2>${latest?`<p class="score ${latest.placement==='Champion'?'win':''}">${latest.placement}</p><p>${latest.summary}</p>`:'<p class="muted">The complete bracket will appear after the first circuit event.</p>'}</section><section class="card span12"><div class="eyebrow">Latest complete bracket</div>${latest?`<div class="table-wrap"><table><thead><tr><th>Round</th><th>Match</th><th>Score</th><th>Winner</th></tr></thead><tbody>${latest.matches.map(m=>`<tr><td>${m.round}</td><td>${m.a} vs ${m.b}</td><td>${m.score}</td><td>${m.winner}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No bracket results yet.</div>'}</section></div>`);attachDivisionSelector()}
  function renderExpansion(){const d=fightingDivision();shell(`<section class="card"><div class="eyebrow">Organization expansion</div><h2>Enter a New Esport</h2><p class="muted">Expansion is optional. Your original tactical team remains fully playable on its own.</p><div class="market"><article class="player"><div class="player-head"><h3>Clash Circuit</h3><span class="role">Fighting game</span></div><p>One competitor plays best-of-five game sets through small elimination brackets. Preparation and individual consistency matter more than teamwork.</p><table><tr><td>Setup cost</td><td><strong>${money(FIGHT_SETUP_COST)}</strong></td></tr><tr><td>Required roster</td><td>1 signed competitor</td></tr><tr><td>Expected weekly cost</td><td>$650–$1,200</td></tr><tr><td>Next competition</td><td>${d?nextFightEvent(d):'One week after opening'}</td></tr></table>${d?'<p class="notice">This division is active. Manage it using the division selector.</p>':`<button class="btn" id="openFight" ${state.cash<FIGHT_SETUP_COST?'disabled':''}>Open fighting division</button>${state.cash<FIGHT_SETUP_COST?'<p class="notice bad">Insufficient cash. You need $12,000.</p>':''}`}</article><article class="player" style="opacity:.65"><div class="player-head"><h3>Velocity League</h3><span class="role">Vehicle arena</span></div><p>A three-player team built around mechanics, coordination, and chemistry.</p><p class="notice">Coming after the other organization systems are working.</p><button class="btn secondary" disabled>Not available yet</button></article></div></section>`);if(!d)document.getElementById('openFight').onclick=openFightDivision}
  function openFightDivision(){confirmModal('Open the Clash Circuit division?',`Pay ${money(FIGHT_SETUP_COST)} now. Kai “Vanta” Mercer joins as the required competitor at $650 per week. The first tournament is next week.`,()=>{state.cash-=FIGHT_SETUP_COST;state.divisions.fighting={id:'fighting',kind:'fighting_game',name:'Clash Circuit',active:true,openedWeek:state.totalWeeks,fans:250,training:'balanced',strategy:'adaptable',nextTournamentWeek:state.totalWeeks+1,lastWeeklyNet:-FIGHT_SETUP_COST,history:[],finances:[],competitor:{id:'fg-vanta',name:'Kai Mercer',nick:'Vanta',skill:63,consistency:67,preparation:55,potential:84,morale:74,fatigue:8,salary:650}};state.organizationHistory.unshift({week:state.totalWeeks,type:'division_opened',text:'Opened the Clash Circuit fighting division'});state.ledger.unshift({label:'Opened fighting division',income:0,expenses:FIGHT_SETUP_COST,net:-FIGHT_SETUP_COST,oneTime:true,divisionBreakdown:{fighting:-FIGHT_SETUP_COST}});state.activeDivisionId='fighting';save();closeModal();activeTab='team';render();toast('Fighting division opened.')})}
  function closeFightDivision(){const d=fightingDivision();confirmModal('Close the fighting division?',`Pay ${money(FIGHT_CLOSE_COST)} now. The competitor leaves, but every tournament result remains in organization history. Your tactical division is unaffected.`,()=>{if(state.cash<FIGHT_CLOSE_COST){closeModal();return toast('Insufficient cash for the closing cost.')}state.cash-=FIGHT_CLOSE_COST;state.archivedDivisions.push({...clone(d),active:false,closedWeek:state.totalWeeks});state.organizationHistory.unshift({week:state.totalWeeks,type:'division_closed',text:'Closed the Clash Circuit fighting division'});delete state.divisions.fighting;state.ledger.unshift({label:'Closed fighting division',income:0,expenses:FIGHT_CLOSE_COST,net:-FIGHT_CLOSE_COST,oneTime:true,divisionBreakdown:{fighting:-FIGHT_CLOSE_COST}});state.activeDivisionId='tactical';save();closeModal();activeTab='dashboard';render();toast('Division closed; its history was preserved.')})}
  function fightRating(entry,d){if(entry.id==='player'){const p=d.competitor;let value=p.skill*.56+p.consistency*.2+p.preparation*.15+p.morale*.09-p.fatigue*.15;if(d.strategy==='pressure')value+=3+(rng()-.5)*10;if(d.strategy==='defensive')value+=(p.consistency+p.preparation-120)*.08;return value}return entry.skill*.72+entry.consistency*.28}
  function fightSeries(a,b,round,d){const av=fightRating(a,d),bv=fightRating(b,d),aWins=av-bv+(rng()+rng()-1)*10>0,loser=Math.max(0,Math.min(2,Math.floor(rng()*3))),winner=aWins?a:b;return{round,a:a.name,b:b.name,score:aWins?`3–${loser}`:`${loser}–3`,winner:winner.name,winnerEntry:winner}}
  function runFightTournament(d){const player={id:'player',name:`${d.competitor.name} “${d.competitor.nick}”`},opponents=FIGHT_OPPONENTS.map(x=>clone(x)),matches=[],qPairs=[[player,opponents[0]],[opponents[1],opponents[2]],[opponents[3],opponents[4]],[opponents[5],opponents[6]]],qWinners=qPairs.map(pair=>{const m=fightSeries(pair[0],pair[1],'Quarterfinal',d);matches.push(m);return m.winnerEntry}),sPairs=[[qWinners[0],qWinners[1]],[qWinners[2],qWinners[3]]],sWinners=sPairs.map(pair=>{const m=fightSeries(pair[0],pair[1],'Semifinal',d);matches.push(m);return m.winnerEntry}),final=fightSeries(sWinners[0],sWinners[1],'Final',d);matches.push(final);let placement='Top 8',prize=200;if(final.winnerEntry.id==='player'){placement='Champion';prize=4500}else if(sWinners.some(x=>x.id==='player')){placement='Runner-up';prize=1800}else if(qWinners.some(x=>x.id==='player')){placement='Semifinalist';prize=600}const clean=matches.map(({winnerEntry,...m})=>m),number=d.history.length+1,name=['Neon Alley Open','Midline Masters','Crown Circuit Cup'][number%3];return{name,week:state.totalWeeks,placement,prize,matches:clean,summary:`${d.competitor.nick} finished as ${placement.toLowerCase()} and earned ${money(prize)}.`}}
  function processFightingWeek(){const d=fightingDivision();if(!d)return;const training=FIGHT_TRAINING[d.training]||FIGHT_TRAINING.balanced,p=d.competitor;p.fatigue=clamp(p.fatigue+training.fatigue);if(d.training==='rest')p.morale=clamp(p.morale+3);else{p.skill=clamp(p.skill+training.skill*Math.max(.25,(p.potential-p.skill)/22));p.preparation=clamp(p.preparation+training.prep);p.morale=clamp(p.morale+(rng()>.4?1:-1))}let income=0,expenses=p.salary+training.cost,result=null;if(state.totalWeeks>=d.nextTournamentWeek){expenses+=200;result=runFightTournament(d);income+=result.prize;d.history.unshift(result);d.nextTournamentWeek=state.totalWeeks+2;p.fatigue=clamp(p.fatigue+8);p.preparation=clamp(p.preparation-9);if(result.placement==='Champion'){d.fans+=180;state.reputation=clamp(state.reputation+2)}else if(result.placement==='Runner-up'){d.fans+=90;state.reputation=clamp(state.reputation+1)}else d.fans+=25}const net=income-expenses;state.cash+=net;d.lastWeeklyNet=net;d.finances.unshift({week:state.totalWeeks,income,expenses,net,result:result?.placement||'Training week'});if(state.ledger[0]){state.ledger[0].income+=income;state.ledger[0].expenses+=expenses;state.ledger[0].net+=net;state.ledger[0].divisionBreakdown={...(state.ledger[0].divisionBreakdown||{}),fighting:net,tactical:state.ledger[0].net-net}}if(state.cash<TUNING.bankruptcy)state.bankrupt=true}
  function importSave(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result),oldVersion=Number(imported.saveVersion||imported.version||1);state=migrateSave(imported,true);save();activeTab='dashboard';render();toast(oldVersion<SAVE_VERSION?'Older save imported and safely updated.':'Save imported.')}catch(error){toast(error.message||'That is not a valid game save.')}};reader.onerror=()=>toast('The save file could not be read.');reader.readAsText(f)}
  const processOneWeek=advanceWeek;
  advanceWeek=function(){if(advancing)return;advancing=true;const before=`${state.season}|${state.week}|${state.phase}`;try{const result=processOneWeek(),after=`${state.season}|${state.week}|${state.phase}`;if(after!==before){state.totalWeeks=(state.totalWeeks||0)+1;processFightingWeek();save();render()}return result}finally{advancing=false}}
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw){state=migrateSave(JSON.parse(raw),true);save()}}catch(error){loadError='Saved progress could not be loaded: '+(error.message||'unknown problem')}render();if(loadError)setTimeout(()=>toast(loadError),50);
  </script>
